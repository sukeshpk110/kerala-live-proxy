
name: Test YouTube Extraction

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade "yt-dlp[default]"

      - name: Test Amrita News
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          set -e
          trap 'rm -f cookies.txt' EXIT

          python - <<'PY'
          import os
          import base64
          from pathlib import Path

          value = os.environ.get("YOUTUBE_COOKIES_B64", "")
          if not value:
              raise SystemExit("ERROR: GitHub cookie secret is missing")

          data = base64.b64decode(value, validate=True)
          Path("cookies.txt").write_bytes(data)

          print("Cookie file loaded:", len(data), "bytes")
          PY

          yt-dlp \
            --verbose \
            --cookies cookies.txt \
            --skip-download \
            --no-warnings \
            --print "%(id)s | %(live_status)s | %(title)s" \
            "https://www.youtube.com/@AmritaNews/live"
